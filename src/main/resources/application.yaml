server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/llm_gateway?serverTimezone=Asia/Kolkata
    username: llm_user
    password: llm_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # Run data.sql AFTER Hibernate creates/updates the schema, so the seed
    # inserts target tables that already exist.
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  # Always run schema/data SQL scripts (data.sql), not just for embedded DBs.
  sql:
    init:
      mode: always

  redis:
    host: localhost
    port: 6379

  jmx:
      enabled: false


providers:
  configs:
    nvidia:
      api-key: ${NVIDIA_API_KEY}
      base-url: https://integrate.api.nvidia.com/v1
      enabled: true
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://api.openai.com/v1
      enabled: true
    google:
      api-key: ${GEMINI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/models
      enabled: true
    claude:
      apiKey: ${ANTHROPIC_API_KEY}
      baseUrl: https://api.anthropic.com/v1/messages
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      llmProvider:
        failureRateThreshold: 50
        minimumNumberOfCalls: 5
        slidingWindowSize: 10
        waitDurationInOpenState: 10s

logging:
  level:
    org.springframework.security: INFO